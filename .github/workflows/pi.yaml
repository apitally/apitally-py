name: Pi

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  pi:
    if: |
      github.actor == 'itssimon' &&
      github.triggering_actor == 'itssimon' &&
      (startsWith(github.event.comment.body, '/pi ') || startsWith(github.event.review.body, '/pi ')) &&
      (github.event_name == 'issue_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "issue_comment" && -n "$ISSUE_PULL_REQUEST_URL" ]]; then
            read -r CHECKOUT_REF HEAD_REPOSITORY <<< "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ISSUE_NUMBER" --jq '[.head.sha, .head.repo.full_name] | @tsv')"
            if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::Cannot run Pi on a fork pull request"
              exit 1
            fi
          elif [[ "$EVENT_NAME" != "issue_comment" ]]; then
            CHECKOUT_REF="$REVIEW_HEAD_SHA"
          fi
          echo "checkout_ref=${CHECKOUT_REF:-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ secrets.PI_GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: shaftoe/pi-coding-agent-action@193431b0260194099a5e6c91e5b69b8e3c9d3fb1 # develop
        with:
          github_token: ${{ github.token }}
          provider: openrouter
          model: openai/gpt-6-sol
          token: ${{ secrets.PI_OPENROUTER_API_KEY }}
          thinking_level: high
